[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragkb"
version = "1.1.0"
description = "Локальная RAG-система над корпоративной базой знаний"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "chromadb>=0.5",
    "pypdf>=3.17",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
local-models = ["sentence-transformers>=3.0", "torch>=2.2"]
better-pdf = ["pdfplumber>=0.11"]
morphology = ["pymorphy3>=2.0"]

[project.scripts]
ragkb = "ragkb.cli:main"

[tool.setuptools.packages.find]
include = ["ragkb*"]
