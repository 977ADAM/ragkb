# Конфигурация RAG-системы.
# Переменные окружения перекрывают эти значения: RAGKB_LLM_BACKEND, RAGKB_EMBEDDING_MODEL и т.д.

docs_dir: data/docs
index_dir: data/index
language: ru

# Чья это база знаний. Одна установка обслуживает одну организацию —
# разные организации разводятся разными развёртываниями, а не фильтрами
# внутри сервиса. Пустое name означает «не настроено»: /organizations
# тогда отдаёт пустой список.
organization:
  name: ""
  id: ""          # пусто = берётся name
  description: ""

chunking:
  size: 900          # символов; ~230 токенов для русского текста
  overlap: 150
  min_size: 120
  respect_structure: true

embedding:
  # tfidf — работает сразу, без моделей и сети (baseline, для тестов и CI)
  # ollama — рекомендуется для боевой эксплуатации: bge-m3 или multilingual-e5
  backend: tfidf
  model: bge-m3
  base_url: http://localhost:11434
  batch_size: 32
  query_prefix: ""   # для e5-моделей: "query: "
  doc_prefix: ""     # для e5-моделей: "passage: "
  tfidf_dim: 4096

store:
  # chroma — ChromaDB: HNSW-индекс, фильтры по метаданным, инкрементальное
  #          обновление документов (ragkb update / delete)
  # numpy  — матрица в памяти, точный перебор, без внешних зависимостей
  backend: chroma
  collection: knowledge_base
  chroma_host: ""      # пусто = встроенный режим (файлы в index_dir/chroma)
  chroma_port: 8000
  upsert_batch: 500
  hnsw_construction_ef: 200
  hnsw_search_ef: 100
  hnsw_m: 16

retrieval:
  top_k: 5
  candidates: 30
  use_bm25: true
  use_dense: true
  rrf_k: 60
  use_mmr: true
  mmr_lambda: 0.7
  min_score: 0.0
  reranker: none     # "sentence-transformers" для cross-encoder реранка
  reranker_model: BAAI/bge-reranker-v2-m3

llm:
  # extractive — без нейросети, собирает ответ из фрагментов
  # ollama — локальная модель
  # openai — любой OpenAI-совместимый endpoint: vLLM, LM Studio, llama.cpp server.
  #          Ключ не требуется: Authorization уходит только при заданном api_key.
  # Адрес сервера (base_url) здесь не задан намеренно: он читается только
  # из .env (RAGKB_LLM_URL) — загрузку файла выполняет Config.load при старте.
  backend: openai
  # llama.cpp server, единственная модель:
  model: /home/adminai/models/qwen2.5-coder-14b/qwen2.5-coder-14b-instruct-q4_k_m.gguf
  temperature: 0.1
  # Сервер выдаёт ~1 токен/с: ответ в 1024 токена шёл бы ~17 минут, и пришёл бы
  # одним куском (openai-бэкенд не потоковый). 256 — разумный предел для ответа
  # с цитатами; таймаут обязан пережить генерацию.
  max_tokens: 256
  timeout: 600
  # Список моделей, доступных для выбора. У openai-бэкенда единственная модель —
  # из настроек; список лишь сужает её до вручную заданного подмножества.
  available: []
