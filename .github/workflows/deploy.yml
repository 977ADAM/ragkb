name: Deploy
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, linux, ragkb]
    timeout-minutes: 30
    steps:
      - name: Pull and compose
        run: |
          set -euo pipefail
          cd /opt/ragkb
          git pull origin main
          docker compose up -d --build migrate rag frontend
