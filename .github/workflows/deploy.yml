name: Deploy
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, linux, ragkb]
    timeout-minutes: 30
    steps:
      - name: Reset to origin/main and compose
        run: |
          set -euo pipefail
          cd /opt/ragkb
          git fetch origin
          git reset --hard origin/main
          docker compose up -d --build postgres migrate rag frontend
