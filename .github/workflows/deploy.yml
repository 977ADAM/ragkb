name: Deploy
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH Deploy
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          command_timeout: 15m
          envs: GITHUB_REF_NAME
          script: |
            set -euo pipefail
            cd /opt/ragkb
            git fetch --tags --force --prune origin
            if git rev-parse "refs/tags/${GITHUB_REF_NAME}" >/dev/null 2>&1; then
              git reset --hard "refs/tags/${GITHUB_REF_NAME}"
            else
              git reset --hard origin/main
            fi
            bash deploy.sh
