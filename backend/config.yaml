# Конфигурация RAG-системы.
# Переменные окружения перекрывают эти значения: RAGKB_LLM_BACKEND, RAGKB_EMBEDDING_MODEL и т.д.

docs_dir: data/docs
index_dir: data/index
language: ru

logging:
  level: INFO
  dir: data/logs   # пусто — только stdout; в compose том data/logs

# Чья это база знаний. Одна установка обслуживает одну организацию —
# разные организации разводятся разными развёртываниями, а не фильтрами
# внутри сервиса. Пустое name означает «не настроено»: /organizations
# тогда отдаёт пустой список.
organization:
  name: ""
  id: ""          # пусто = берётся name
  description: ""

chunking:
  size: 900          # символов; ~230 токенов для русского текста
  overlap: 150
  min_size: 120
  respect_structure: true

embedding:
  # tfidf — без сети (baseline, тесты)
  # sentence-transformers — HuggingFace (transformers), модель в процессе rag
  # openai — OpenAI-совместимый HTTP: POST /embeddings
  backend: tfidf
  model: BAAI/bge-m3
  # Адрес и ключ: RAGKB_EMBEDDING_URL, RAGKB_EMBEDDING_API_KEY (только openai)
  base_url: ""
  batch_size: 32
  query_prefix: ""   # для e5-моделей: "query: "
  doc_prefix: ""     # для e5-моделей: "passage: "
  tfidf_dim: 4096

store:
  # chroma — ChromaDB: HNSW-индекс, фильтры по метаданным, инкрементальное
  #          обновление документов (в коде библиотеки)
  # numpy  — матрица в памяти, точный перебор, без внешних зависимостей
  backend: chroma
  collection: knowledge_base
  chroma_host: ""      # пусто = встроенный режим (файлы в index_dir/chroma)
  chroma_port: 8000
  upsert_batch: 500
  hnsw_construction_ef: 200
  hnsw_search_ef: 100
  hnsw_m: 16

retrieval:
  top_k: 5
  candidates: 30
  use_bm25: true
  use_dense: true
  rrf_k: 60
  use_mmr: true
  mmr_lambda: 0.7
  min_score: 0.0
  reranker: none     # "sentence-transformers" для cross-encoder реранка
  reranker_model: BAAI/bge-reranker-v2-m3

llm:
  # extractive — без нейросети
  # openai — любой OpenAI-совместимый HTTP (vLLM, llama.cpp, LM Studio, облако).
  #          Authorization только при RAGKB_LLM_API_KEY.
  # Адрес: RAGKB_LLM_URL (обычно …/v1).
  backend: openai
  model: qwen2.5-instruct
  temperature: 0.1
  max_tokens: 256
  timeout: 600
  # Пусто — GET /models сервера; если сервер список не отдаёт, остаётся model.
  available: []
