[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragkb"
version = "1.5.1"
description = "Локальная RAG-система над корпоративной базой знаний"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "chromadb>=1.3.5",
    "pypdf>=3.17",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "python-multipart>=0.0.32",
    # Ядро собрано на LangChain: цепочка ответа, ретриверы, сплиттеры,
    # интеграции Ollama и Chroma. langchain-community не тянем — он объявлен
    # устаревшим, а BM25 у нас на rank-bm25.
    "langchain-core>=1.6",
    "langchain-classic>=1.0",
    "langchain-text-splitters>=1.1",
    "langchain-ollama>=1.1",
    "langchain-chroma>=1.1",
    "langchain-openai>=1.6",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
better-pdf = ["pdfplumber>=0.11"]
morphology = ["pymorphy3>=2.0"]
migrations = ["alembic>=1.13", "psycopg[binary]>=3.1"]
dev = ["ruff>=0.16", "mypy>=1.11", "pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
include = ["ragkb*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PIE", "RUF", "FURB"]
ignore = [
    "B008",
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"ragkb/core/prompts.py" = ["E501"]
"migrations/env.py" = ["E402"]
"tests/*.py" = ["E402"]

[tool.mypy]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = ["-m", "not integration", "-q"]
pythonpath = ["tests", "."]
markers = [
    "integration: нужен Chroma или внешний сервис",
]
