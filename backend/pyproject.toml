[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragkb"
version = "1.1.0"
description = "Локальная RAG-система над корпоративной базой знаний"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "chromadb>=0.5",
    "pypdf>=3.17",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
local-models = ["sentence-transformers>=3.0", "torch>=2.2"]
better-pdf = ["pdfplumber>=0.11"]
morphology = ["pymorphy3>=2.0"]
migrations = ["alembic>=1.13"]
dev = ["ruff>=0.16", "mypy>=1.11", "pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["ragkb*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PIE", "RUF", "FURB"]
ignore = [
    "B008",
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"ragkb/core/prompts.py" = ["E501"]
"tests/*.py" = ["E402"]

[tool.mypy]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
addopts = ["-m", "not integration", "-q"]
pythonpath = ["tests"]
markers = [
    "integration: нужен Chroma или внешний сервис",
]
