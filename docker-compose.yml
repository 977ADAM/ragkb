x-backend: &backend
  build: ./backend
  image: ragkb:local

services:
  postgres:
    image: postgres:16
    env_file: .env
    volumes:
      - rag_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 20

  migrate:
    <<: *backend
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    command: alembic upgrade head

  rag:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./data/docs:/app/data/docs
      - ./data/logs:/app/data/logs
      - rag_index:/app/data/index
    # Ollama живёт на хосте, а не в compose: модели остаются под управлением
    # `ollama pull`, образ rag остаётся без torch. Адрес по умолчанию задан
    # в Dockerfile и перекрывается RAGKB_EMBEDDING_URL в .env.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: .env

  frontend:
    build: ./frontend
    depends_on:
      - rag
    ports:
      - "3000:3000"
    env_file: .env

volumes:
  rag_index:
  rag_pg:
