# Локальный контур: RAG + SvelteKit + Keycloak на MariaDB.
# Модели — снаружи, OpenAI-совместимый HTTP (vLLM, llama.cpp, облако…).
# Наружу — frontend (3000) и keycloak (8443). На сервере TLS и вход — Angie,
# не входит в этот compose.
#
#   cp .env.example .env   # пароли, RAGKB_LLM_URL, RAGKB_EMBEDDING_URL
#   # сертификаты в ./certs (для Keycloak)
#   docker compose up -d

services:
  migrate:
    build: ./backend
    image: ragkb:local
    volumes:
      - rag_history:/app/data/history
    environment:
      RAGKB_HISTORY_PATH: /app/data/history/history.sqlite3
    command: alembic upgrade head
    restart: "no"

  rag:
    build: ./backend
    image: ragkb:local
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./data/docs:/app/data/docs:ro
      - rag_index:/app/data/index
      - rag_history:/app/data/history
    environment:
      RAGKB_EMBEDDING_BACKEND: ${RAGKB_EMBEDDING_BACKEND:-openai}
      RAGKB_EMBEDDING_MODEL: ${RAGKB_EMBEDDING_MODEL:-bge-m3}
      RAGKB_EMBEDDING_URL: ${RAGKB_EMBEDDING_URL}
      RAGKB_EMBEDDING_API_KEY: ${RAGKB_EMBEDDING_API_KEY:-}
      RAGKB_LLM_BACKEND: ${RAGKB_LLM_BACKEND:-openai}
      RAGKB_LLM_MODEL: ${RAGKB_LLM_MODEL}
      RAGKB_LLM_URL: ${RAGKB_LLM_URL}
      RAGKB_LLM_API_KEY: ${RAGKB_LLM_API_KEY:-}
      RAGKB_HISTORY_PATH: /app/data/history/history.sqlite3
      RAGKB_STORE_BACKEND: chroma

  frontend:
    build: ./frontend
    depends_on:
      - rag
    ports:
      - "3000:3000"
    environment:
      RAGKB_BACKEND_URL: http://rag:8000
      # Только локально, без Angie. В бою не задавать — заголовки ставит Angie.
      RAGKB_DEV_USER: ${RAGKB_DEV_USER:-}
      RAGKB_DEV_GROUPS: ${RAGKB_DEV_GROUPS:-}

  mariadb:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: keycloak
      MARIADB_USER: keycloak
      MARIADB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    volumes:
      - keycloak_db:/var/lib/mysql

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    depends_on:
      - mariadb
    command: start
    environment:
      KC_DB: mariadb
      KC_DB_URL: jdbc:mariadb://mariadb:3306/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME_URL}
      KC_HTTPS_CERTIFICATE_FILE: /certs/tls.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /certs/tls.key
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "8443:8443"
    volumes:
      - ./certs:/certs:ro
    networks:
      default:
        aliases:
          - ${KEYCLOAK_HOSTNAME}

volumes:
  rag_index:
  rag_history:
  keycloak_db:
