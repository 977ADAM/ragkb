# Локальный контур: Ollama + RAG-бэкенд + SvelteKit за oauth2-proxy,
# Keycloak (группы ragkb-users / ragkb-admins) на MariaDB.
# Наружу — proxy (443) и keycloak (8443).
#
#   cp .env.example .env
#   # сертификаты в ./certs
#   docker compose up -d
#   docker compose exec ollama ollama pull bge-m3
#   docker compose exec ollama ollama pull qwen2.5:7b-instruct
#   # индекс: кнопка в интерфейсе (админ) или POST /index/rebuild через сеанс

services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"

  migrate:
    build: ./backend
    image: ragkb:local
    volumes:
      - rag_history:/app/data/history
    environment:
      RAGKB_HISTORY_PATH: /app/data/history/history.sqlite3
    command: alembic upgrade head
    restart: "no"

  rag:
    build: ./backend
    image: ragkb:local
    depends_on:
      ollama:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./data/docs:/app/data/docs:ro
      - rag_index:/app/data/index
      - rag_history:/app/data/history
    environment:
      RAGKB_EMBEDDING_BACKEND: ollama
      RAGKB_EMBEDDING_MODEL: bge-m3
      RAGKB_EMBEDDING_URL: http://ollama:11434
      RAGKB_LLM_BACKEND: ollama
      RAGKB_LLM_MODEL: qwen2.5:7b-instruct
      RAGKB_LLM_URL: http://ollama:11434
      RAGKB_HISTORY_PATH: /app/data/history/history.sqlite3
      RAGKB_STORE_BACKEND: chroma

  frontend:
    build: ./frontend
    depends_on:
      - rag
    environment:
      RAGKB_BACKEND_URL: http://rag:8000
    # RAGKB_DEV_USER в бою не задаётся.

  mariadb:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: keycloak
      MARIADB_USER: keycloak
      MARIADB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    volumes:
      - keycloak_db:/var/lib/mysql

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    depends_on:
      - mariadb
    command: start
    environment:
      KC_DB: mariadb
      KC_DB_URL: jdbc:mariadb://mariadb:3306/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME_URL}
      KC_HTTPS_CERTIFICATE_FILE: /certs/tls.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /certs/tls.key
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "8443:8443"
    volumes:
      - ./certs:/certs:ro
    networks:
      default:
        aliases:
          - ${KEYCLOAK_HOSTNAME}

  proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.2
    depends_on:
      - keycloak
      - frontend
    ports:
      - "443:4180"
    volumes:
      - ./certs:/certs:ro
    command:
      - --provider=keycloak-oidc
      - --oidc-issuer-url=${KEYCLOAK_ISSUER_URL}
      - --client-id=ragkb
      - --client-secret=${OAUTH2_CLIENT_SECRET}
      - --cookie-secret=${OAUTH2_COOKIE_SECRET}
      - --cookie-secure=true
      - --email-domain=*
      - --http-address=
      - --https-address=0.0.0.0:4180
      - --tls-cert-file=/certs/tls.crt
      - --tls-key-file=/certs/tls.key
      - --upstream=http://frontend:3000
      - --redirect-url=${OAUTH2_REDIRECT_URL}
      - --reverse-proxy=false
      - --provider-ca-file=/certs/ca.crt
      - --allowed-group=ragkb-users
      - --pass-user-headers=true
      - --skip-auth-strip-headers=true

volumes:
  ollama_models:
  rag_index:
  rag_history:
  keycloak_db:
