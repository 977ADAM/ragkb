x-backend: &backend
  build: ./backend
  image: ragkb:local
  environment:
    RAGKB_AUTH_MODE: disabled

services:
  postgres:
    image: postgres:16
    env_file: .env
    volumes:
      - rag_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 20

  migrate:
    <<: *backend
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    command: alembic upgrade head

  ensure-admin:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file: .env
    command: python -m scripts.ensure_admin

  rag:
    <<: *backend
    depends_on:
      ensure-admin:
        condition: service_completed_successfully
    volumes:
      - ./data/docs:/app/data/docs
      - ./data/logs:/app/data/logs
      - rag_index:/app/data/index
      - rag_hf:/app/data/hf
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: .env

  frontend:
    build: ./frontend
    depends_on:
      - rag
    ports:
      - "3000:3000"
    env_file: .env

volumes:
  rag_index:
  rag_pg:
  rag_hf:
