# По умолчанию: RAG + SvelteKit (порт 3000). Keycloak/MariaDB — профиль idp.
# LLM — OpenAI-совместимый HTTP. Эмбеддинги — HuggingFace в контейнере rag.
# На сервере TLS и вход — Angie (не в compose).
#
#   cp .env.example .env
#   docker compose up -d
#   docker compose --profile idp up -d   # Keycloak на :8443

services:
  migrate:
    build: ./backend
    image: ragkb:local
    volumes:
      - rag_history:/app/data/history
    environment:
      RAGKB_HISTORY_PATH: /app/data/history/history.sqlite3
    command: alembic upgrade head
    restart: "no"

  rag:
    build: ./backend
    image: ragkb:local
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./data/docs:/app/data/docs:ro
      - ./data/logs:/app/data/logs
      - rag_index:/app/data/index
      - rag_history:/app/data/history
      - rag_hf:/app/data/hf
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      RAGKB_AUTH_MODE: ${RAGKB_AUTH_MODE:-proxy}
      RAGKB_ORG_NAME: ${RAGKB_ORG_NAME:-}
      RAGKB_ORG_ID: ${RAGKB_ORG_ID:-}
      RAGKB_EMBEDDING_BACKEND: ${RAGKB_EMBEDDING_BACKEND:-sentence-transformers}
      RAGKB_EMBEDDING_MODEL: ${RAGKB_EMBEDDING_MODEL:-BAAI/bge-m3}
      HF_HOME: /app/data/hf
      RAGKB_LLM_BACKEND: ${RAGKB_LLM_BACKEND:-openai}
      RAGKB_LLM_MODEL: ${RAGKB_LLM_MODEL:-}
      RAGKB_LLM_URL: ${RAGKB_LLM_URL}
      RAGKB_LLM_API_KEY: ${RAGKB_LLM_API_KEY:-}
      RAGKB_HISTORY_PATH: /app/data/history/history.sqlite3
      RAGKB_STORE_BACKEND: chroma
      RAGKB_LOG_DIR: /app/data/logs

  frontend:
    build: ./frontend
    depends_on:
      - rag
    ports:
      - "3000:3000"
    environment:
      RAGKB_BACKEND_URL: http://rag:8000
      # Только локально, без Angie. В бою не задавать — заголовки ставит Angie.
      RAGKB_DEV_USER: ${RAGKB_DEV_USER:-}
      RAGKB_DEV_GROUPS: ${RAGKB_DEV_GROUPS:-}

  mariadb:
    profiles: ["idp"]
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: keycloak
      MARIADB_USER: keycloak
      MARIADB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    volumes:
      - keycloak_db:/var/lib/mysql

  keycloak:
    profiles: ["idp"]
    image: quay.io/keycloak/keycloak:26.4
    depends_on:
      - mariadb
    command: start
    environment:
      KC_DB: mariadb
      KC_DB_URL: jdbc:mariadb://mariadb:3306/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME_URL}
      KC_HTTPS_CERTIFICATE_FILE: /certs/tls.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /certs/tls.key
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "8443:8443"
    volumes:
      - ./certs:/certs:ro
    networks:
      default:
        aliases:
          - ${KEYCLOAK_HOSTNAME}

volumes:
  rag_index:
  rag_history:
  rag_hf:
  keycloak_db:
