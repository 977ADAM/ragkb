# RAG + SvelteKit (порт 3000). LLM — OpenAI-совместимый HTTP.
# Эмбеддинги — HuggingFace в контейнере rag.
# На сервере TLS — Angie (не в compose). Keycloak в стеке нет.
#
#   cp .env.example .env
#   docker compose up -d

services:
  migrate:
    build: ./backend
    image: ragkb:local
    volumes:
      - rag_history:/app/data/history
    environment:
      RAGKB_HISTORY_PATH: /app/data/history/history.sqlite3
    command: alembic upgrade head
    restart: "no"

  rag:
    build: ./backend
    image: ragkb:local
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./data/docs:/app/data/docs:ro
      - ./data/logs:/app/data/logs
      - rag_index:/app/data/index
      - rag_history:/app/data/history
      - rag_hf:/app/data/hf
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      RAGKB_AUTH_MODE: ${RAGKB_AUTH_MODE:-session}
      RAGKB_ORG_NAME: ${RAGKB_ORG_NAME:-}
      RAGKB_ORG_ID: ${RAGKB_ORG_ID:-}
      RAGKB_EMBEDDING_BACKEND: ${RAGKB_EMBEDDING_BACKEND:-sentence-transformers}
      RAGKB_EMBEDDING_MODEL: ${RAGKB_EMBEDDING_MODEL:-BAAI/bge-m3}
      HF_HOME: /app/data/hf
      RAGKB_LLM_BACKEND: ${RAGKB_LLM_BACKEND:-openai}
      RAGKB_LLM_MODEL: ${RAGKB_LLM_MODEL:-}
      RAGKB_LLM_URL: ${RAGKB_LLM_URL}
      RAGKB_LLM_API_KEY: ${RAGKB_LLM_API_KEY:-}
      RAGKB_HISTORY_PATH: /app/data/history/history.sqlite3
      RAGKB_STORE_BACKEND: chroma
      RAGKB_LOG_DIR: /app/data/logs

  frontend:
    build: ./frontend
    depends_on:
      - rag
    ports:
      - "3000:3000"
    environment:
      RAGKB_BACKEND_URL: http://rag:8000
      # Не заменяет сессию при RAGKB_AUTH_MODE=session. В бою не задавать.
      RAGKB_DEV_USER: ${RAGKB_DEV_USER:-}
      RAGKB_DEV_GROUPS: ${RAGKB_DEV_GROUPS:-}

volumes:
  rag_index:
  rag_history:
  rag_hf:
