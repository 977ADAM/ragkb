x-backend: &backend
  build: ./backend
  image: ragkb:local

x-db-env: &db-env
  RAGKB_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - rag_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 20

  migrate:
    <<: *backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *db-env
    command: alembic upgrade head

  ensure-admin:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *db-env
      ADMIN_LOGIN: ${ADMIN_LOGIN:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    command: python -m scripts.ensure_admin

  rag:
    <<: *backend
    depends_on:
      ensure-admin:
        condition: service_completed_successfully
    volumes:
      - ./data/docs:/app/data/docs
      - ./data/logs:/app/data/logs
      - rag_index:/app/data/index
      - rag_hf:/app/data/hf
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *db-env
      RAGKB_AUTH_MODE: ${RAGKB_AUTH_MODE:-session}
      RAGKB_ORG_NAME: ${RAGKB_ORG_NAME:-}
      RAGKB_ORG_ID: ${RAGKB_ORG_ID:-}
      RAGKB_LLM_MODEL: ${RAGKB_LLM_MODEL:-}
      RAGKB_LLM_URL: ${RAGKB_LLM_URL}
      RAGKB_LLM_API_KEY: ${RAGKB_LLM_API_KEY:-}

  frontend:
    build: ./frontend
    depends_on:
      - rag
    ports:
      - "3000:3000"
    environment:
      RAGKB_DEV_USER: ${RAGKB_DEV_USER:-}
      RAGKB_DEV_GROUPS: ${RAGKB_DEV_GROUPS:-}

volumes:
  rag_index:
  rag_pg:
  rag_hf:
